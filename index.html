<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CraftPulse · Royal Neighbourhood Makers & Live Craft Queue</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       ROYAL DESIGN SYSTEM: IMPERIAL EMERALD, BURNISHED GOLD & OBSIDIAN
       ========================================================================== */
    :root {
      --bg: #F9F6F0;
      --paper: #FFFFFF;
      --card-bg: #FFFFFF;
      --ink: #111A16;
      --ink-muted: #53635B;
      --line: #E2DAC6;
      --line-subtle: #EDE6D8;
      
      /* Royal Imperial Emerald */
      --royal-emerald: #0A3D2E;
      --royal-emerald-dark: #06261D;
      --royal-emerald-light: #E1EFEA;
      --royal-emerald-glow: rgba(10, 61, 46, 0.25);

      /* Burnished Royal Gold */
      --royal-gold: #C59B27;
      --royal-gold-light: #F9F2DC;
      --royal-gold-bright: #E5B83B;
      --royal-gold-glow: rgba(197, 155, 39, 0.35);

      /* Warm Accent */
      --royal-copper: #C85A2A;
      --royal-copper-light: #FCECE4;
      
      --shadow-sm: 0 4px 12px rgba(10, 38, 29, 0.05);
      --shadow: 0 12px 32px rgba(10, 38, 29, 0.08);
      --shadow-lg: 0 24px 50px rgba(10, 38, 29, 0.15);
      --radius-sm: 8px;
      --radius: 16px;
      --radius-lg: 24px;
      --radius-pill: 9999px;
      --font-serif: 'Fraunces', Georgia, serif;
      --font-sans: 'DM Sans', system-ui, -apple-system, sans-serif;
      --transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      color-scheme: light;
    }

    html[data-theme="dark"] {
      --bg: #0C1210;
      --paper: #141D1A;
      --card-bg: #16221E;
      --ink: #F4EFE6;
      --ink-muted: #A1B2AA;
      --line: #273630;
      --line-subtle: #1C2723;

      --royal-emerald: #3DB88F;
      --royal-emerald-dark: #0A3D2E;
      --royal-emerald-light: #163328;
      --royal-emerald-glow: rgba(61, 184, 143, 0.3);

      --royal-gold: #E5B83B;
      --royal-gold-light: #2C2613;
      --royal-gold-bright: #FFD566;
      --royal-gold-glow: rgba(229, 184, 59, 0.35);

      --royal-copper: #E67A4D;
      --royal-copper-light: #381E15;

      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.3);
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      --shadow-lg: 0 24px 50px rgba(0, 0, 0, 0.6);
      color-scheme: dark;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.55;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: transparent; }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; object-fit: cover; }
    .serif { font-family: var(--font-serif); }

    /* Keyframe Animations */
    @keyframes goldShimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.75; }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes toolStitch {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-4px) rotate(-6deg); }
      75% { transform: translateY(3px) rotate(5deg); }
    }

    /* ==========================================================================
       ROYAL TOP NAVIGATION BAR
       ========================================================================== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(249, 246, 240, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      padding: 12px 4vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      transition: background 0.3s ease;
    }
    html[data-theme="dark"] .topbar {
      background: rgba(12, 18, 16, 0.94);
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .brand-logo-mark {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--royal-emerald) 0%, #155E49 100%);
      color: #FFF;
      border-radius: 14px;
      display: grid;
      place-items: center;
      box-shadow: 0 4px 16px var(--royal-emerald-glow);
      border: 1px solid rgba(229, 184, 59, 0.3);
      transition: transform 0.25s ease;
      flex-shrink: 0;
    }
    .brand-wrap:hover .brand-logo-mark {
      transform: scale(1.05) rotate(-3deg);
    }
    .brand-title {
      font-family: var(--font-serif);
      font-size: 23px;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .brand-title span { color: var(--royal-gold); }
    .brand-sub {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--ink-muted);
      font-weight: 700;
      margin-top: 3px;
    }

    /* Role-based Dynamic Navigation links */
    .nav-links-scroll {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 2px;
      scrollbar-width: none;
      max-width: 100%;
    }
    .nav-links-scroll::-webkit-scrollbar { display: none; }

    .nav-btn {
      padding: 9px 18px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-muted);
      background: var(--paper);
      border: 1px solid var(--line);
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .nav-btn:hover {
      color: var(--ink);
      border-color: var(--royal-gold);
      transform: translateY(-1px);
    }
    .nav-btn.active {
      background: linear-gradient(135deg, var(--royal-emerald) 0%, #145945 100%);
      color: #FFF;
      border-color: var(--royal-emerald);
      box-shadow: 0 4px 14px var(--royal-emerald-glow);
    }
    html[data-theme="dark"] .nav-btn.active {
      color: #051A13;
      background: linear-gradient(135deg, #4EDB9F 0%, #3DB88F 100%);
      border-color: #3DB88F;
    }

    .top-tools {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .tool-btn {
      padding: 8px 13px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
      white-space: nowrap;
    }
    .tool-btn:hover {
      border-color: var(--royal-gold);
      background: var(--royal-gold-light);
    }

    /* Role Pill Badge in Top Bar */
    .user-session-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--royal-gold-light);
      border: 1px solid var(--royal-gold);
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 700;
      color: var(--ink);
    }

    /* ==========================================================================
       CONTAINER & HERO
       ========================================================================== */
    .wrap {
      max-width: 1260px;
      width: 100%;
      margin: 0 auto;
      padding: 26px 20px 80px;
      flex: 1;
      animation: fadeInUp 0.4s ease;
    }

    .royal-hero {
      background: linear-gradient(135deg, #072B20 0%, #0F4534 50%, #0A1B16 100%);
      color: #FFF;
      border-radius: var(--radius-lg);
      padding: 42px 46px;
      margin-bottom: 30px;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid rgba(229, 184, 59, 0.2);
    }
    .hero-gold-glow {
      position: absolute;
      top: -100px;
      right: -100px;
      width: 360px;
      height: 360px;
      background: radial-gradient(circle, rgba(229, 184, 59, 0.35) 0%, rgba(229, 184, 59, 0) 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    .hero-watermark {
      position: absolute;
      right: 3%;
      bottom: -20px;
      font-size: 170px;
      opacity: 0.06;
      font-family: var(--font-serif);
      pointer-events: none;
      user-select: none;
      color: #FFD566;
    }
    .hero-kicker {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--royal-gold-bright);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .royal-hero h1 {
      font-family: var(--font-serif);
      font-size: clamp(32px, 4.4vw, 46px);
      font-weight: 500;
      line-height: 1.15;
      margin-bottom: 14px;
      max-width: 760px;
    }
    .royal-hero h1 em {
      font-style: normal;
      background: linear-gradient(90deg, #F9E59C, #D4AF37, #FFEDB3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .royal-hero p {
      color: #D3E0DA;
      font-size: 15px;
      max-width: 620px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .hero-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 22px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      transition: var(--transition);
      white-space: nowrap;
    }
    .btn-gold {
      background: linear-gradient(135deg, #E5B83B 0%, #C59B27 100%);
      color: #141D1A;
      box-shadow: 0 4px 16px var(--royal-gold-glow);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(229, 184, 59, 0.5);
    }
    .btn-emerald {
      background: linear-gradient(135deg, var(--royal-emerald) 0%, #155E49 100%);
      color: #FFF;
      box-shadow: 0 4px 16px var(--royal-emerald-glow);
    }
    .btn-emerald:hover {
      transform: translateY(-2px);
      background: linear-gradient(135deg, #0e4e3c 0%, #176d54 100%);
    }
    .btn-white {
      background: #FFFFFF;
      color: var(--royal-emerald-dark);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
    }
    .btn-white:hover {
      background: #F7F4EB;
      transform: translateY(-2px);
    }
    .btn-outline {
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
    }
    .btn-outline:hover {
      border-color: var(--royal-gold);
      background: var(--royal-gold-light);
    }
    .btn-sm {
      padding: 7px 14px;
      font-size: 12px;
      border-radius: 10px;
    }
    .btn-coral {
      background: var(--royal-copper-light);
      color: var(--royal-copper);
    }
    .btn-coral:hover {
      background: rgba(200, 90, 42, 0.2);
    }

    /* ==========================================================================
       CREATIVE CATEGORY CAROUSEL & RATE TIERS (Item 5)
       ========================================================================== */
    .market-filter-section {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 22px;
      margin-bottom: 28px;
      box-shadow: var(--shadow-sm);
    }
    .filter-header-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--royal-gold);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Creative Royal Craft Category Cards */
    .creative-category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .craft-royal-card {
      background: var(--bg);
      border: 1.5px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: var(--transition);
      cursor: pointer;
      text-align: left;
    }
    .craft-royal-card:hover {
      border-color: var(--royal-gold);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px var(--royal-gold-glow);
    }
    .craft-royal-card.active {
      background: linear-gradient(135deg, var(--royal-emerald-light) 0%, rgba(229, 184, 59, 0.15) 100%);
      border-color: var(--royal-emerald);
      box-shadow: 0 4px 16px var(--royal-emerald-glow);
    }
    .craft-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .craft-icon-wrap {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: var(--paper);
      color: var(--royal-emerald);
      display: grid;
      place-items: center;
      box-shadow: var(--shadow-sm);
    }
    .craft-royal-card.active .craft-icon-wrap {
      background: var(--royal-emerald);
      color: #FFF;
    }
    .craft-icon-wrap svg {
      width: 18px;
      height: 18px;
    }
    .craft-card-count {
      font-size: 10px;
      font-weight: 700;
      color: var(--ink-muted);
      background: var(--paper);
      padding: 2px 7px;
      border-radius: 8px;
    }
    .craft-card-name {
      font-family: var(--font-serif);
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.25;
    }

    /* Creative Rate / Budget Tier Cards */
    .rate-tiers-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .rate-tier-card {
      border: 1.5px solid var(--line);
      background: var(--bg);
      border-radius: 14px;
      padding: 12px 14px;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .rate-tier-card:hover {
      border-color: var(--royal-gold);
      transform: translateY(-2px);
    }
    .rate-tier-card.active {
      border-color: var(--royal-gold);
      background: var(--royal-gold-light);
      box-shadow: 0 4px 16px var(--royal-gold-glow);
    }
    .tier-gem {
      font-size: 20px;
    }
    .tier-info b {
      display: block;
      font-size: 13px;
      font-family: var(--font-serif);
      color: var(--ink);
    }
    .tier-info span {
      font-size: 11px;
      color: var(--ink-muted);
    }

    /* Search & Slider Bar */
    .search-slider-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      padding-top: 14px;
      border-top: 1px solid var(--line-subtle);
    }
    .search-input-wrap {
      position: relative;
      flex: 1;
      min-width: 220px;
    }
    .search-input {
      width: 100%;
      padding: 10px 16px 10px 40px;
      border: 1px solid var(--line);
      border-radius: var(--radius-pill);
      background: var(--bg);
      color: var(--ink);
      font-size: 13px;
      transition: var(--transition);
    }
    .search-input:focus {
      outline: none;
      border-color: var(--royal-gold);
      background: var(--paper);
    }

    /* ==========================================================================
       MAKER CARDS (ROYAL STYLING)
       ========================================================================== */
    .maker-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 24px;
    }
    .maker-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .maker-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow);
      border-color: var(--royal-gold);
    }
    .maker-cover {
      height: 175px;
      position: relative;
      background: #ECE5D8;
      overflow: hidden;
      cursor: pointer;
    }
    .maker-cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }
    .maker-card:hover .maker-cover-img { transform: scale(1.05); }
    .maker-cover-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(7, 43, 32, 0.4) 0%, rgba(0,0,0,0.05) 50%, rgba(7, 43, 32, 0.8) 100%);
    }

    .card-top-badges {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }
    .craft-tag {
      background: rgba(255, 255, 255, 0.95);
      color: var(--royal-emerald-dark);
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--shadow-sm);
    }
    .maker-logo-wrap {
      position: absolute;
      bottom: -24px;
      left: 20px;
      z-index: 3;
    }
    .maker-logo-badge {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: var(--paper);
      border: 3px solid var(--paper);
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      overflow: hidden;
      display: grid;
      place-items: center;
    }

    .maker-body {
      padding: 34px 20px 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .maker-name {
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 600;
      line-height: 1.25;
      cursor: pointer;
    }
    .kyc-verified-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--royal-gold-light);
      color: #7A5C0E;
      border: 1px solid rgba(197, 155, 39, 0.4);
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
    }
    html[data-theme="dark"] .kyc-verified-badge {
      background: rgba(229, 184, 59, 0.15);
      color: var(--royal-gold-bright);
    }

    .maker-timing-bar {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 12px 0 16px;
      font-size: 11px;
    }
    .maker-timing-bar > div span {
      display: block;
      color: var(--ink-muted);
      font-size: 9px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.06em;
      margin-bottom: 2px;
    }
    .maker-timing-bar > div b {
      font-size: 13px;
      font-weight: 600;
    }

    /* Products preview */
    .preview-chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
      margin-bottom: 14px;
    }
    .product-mini-chip {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 5px 10px;
      font-size: 11px;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .product-mini-chip b { color: var(--royal-emerald); }

    .card-footer {
      display: flex;
      gap: 8px;
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid var(--line-subtle);
    }
    .card-footer .btn { flex: 1; }

    /* ==========================================================================
       MAKER STUDIO DASHBOARD & WORKBENCH
       ========================================================================== */
    .studio-dashboard {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
    }
    .stat-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow-sm);
    }
    .stat-card span {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--ink-muted);
    }
    .stat-card b {
      display: block;
      font-family: var(--font-serif);
      font-size: 28px;
      font-weight: 600;
      color: var(--ink);
      margin: 6px 0 2px;
    }

    /* Animated Workbench Pipeline */
    .workbench-pipeline {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
    }
    .workbench-slots {
      display: grid;
      grid-template-columns: 1.3fr 1fr 1fr;
      gap: 14px;
      margin: 16px 0;
    }
    .workbench-slot {
      border: 1.5px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      background: var(--bg);
      position: relative;
    }
    .slot-active {
      border-color: var(--royal-gold);
      background: var(--royal-gold-light);
      box-shadow: 0 4px 18px var(--royal-gold-glow);
    }
    .craft-anim-pulse {
      display: inline-block;
      animation: toolStitch 1.8s infinite ease-in-out;
    }

    /* Stepper */
    .tracker-bar-bg {
      height: 8px;
      background: var(--line);
      border-radius: 4px;
      overflow: hidden;
      margin: 14px 0 10px;
    }
    .tracker-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--royal-emerald) 0%, var(--royal-gold) 100%);
      border-radius: 4px;
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .milestones-steps {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      text-align: center;
      font-size: 10px;
    }
    .milestone-step.done { color: var(--royal-emerald); font-weight: 700; }
    .milestone-step.current { color: var(--royal-gold); font-weight: 700; }

    /* ==========================================================================
       AUTHENTICATION PORTAL (Login & Signup with Embedded KYC)
       ========================================================================== */
    .auth-portal-wrap {
      max-width: 520px;
      margin: 30px auto;
      background: var(--paper);
      border: 1.5px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 34px;
      box-shadow: var(--shadow);
      animation: fadeInUp 0.35s ease;
    }
    .auth-tabs {
      display: flex;
      background: var(--bg);
      padding: 4px;
      border-radius: var(--radius-pill);
      margin-bottom: 22px;
    }
    .auth-tab-btn {
      flex: 1;
      padding: 9px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-muted);
      text-align: center;
      transition: var(--transition);
    }
    .auth-tab-btn.active {
      background: var(--paper);
      color: var(--royal-emerald);
      box-shadow: var(--shadow-sm);
    }

    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--ink);
    }
    .form-control {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--bg);
      color: var(--ink);
      font-size: 13px;
      transition: var(--transition);
    }
    .form-control:focus {
      outline: none;
      border-color: var(--royal-gold);
      background: var(--paper);
    }

    /* KYC Embedded Box in Signup */
    .maker-kyc-signup-box {
      border: 1.5px dashed var(--royal-gold);
      background: var(--royal-gold-light);
      border-radius: 14px;
      padding: 16px;
      margin: 16px 0;
    }

    /* Modal Backdrop */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(6, 22, 17, 0.75);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      place-items: center;
      padding: 20px;
      overflow-y: auto;
    }
    .modal-backdrop.show { display: grid; }
    .modal-window {
      background: var(--paper);
      border: 1.5px solid var(--line);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 580px;
      padding: 30px;
      box-shadow: var(--shadow-lg);
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
    }
    .modal-head h2 { font-family: var(--font-serif); font-size: 24px; }
    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--bg);
      display: grid;
      place-items: center;
      font-size: 20px;
    }

    /* Toast */
    .toast-pill {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translate(-50%, 40px);
      opacity: 0;
      background: #0B211A;
      color: #FFF;
      border: 1px solid var(--royal-gold);
      padding: 12px 24px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      z-index: 200;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }
    .toast-pill.show { transform: translate(-50%, 0); opacity: 1; }

    /* Responsive */
    @media (max-width: 860px) {
      .royal-hero { padding: 28px 22px; }
      .workbench-slots { grid-template-columns: 1fr; }
      .creative-category-grid { grid-template-columns: repeat(2, 1fr); }
      .topbar { padding: 12px 14px; }
    }
  </style>

        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.getElementById('img-compress-canvas');
            const ctx = canvas.getContext('2d');
            const scale = Math.min(1, maxWidth / img.width);
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
        };
        reader.onerror = reject;
      });
    }

    function calculateMakerWaitMinutes(maker) {
      if (!maker) return 60;
      const queueCount = Number(maker.queue) || 0;
      const workers = Math.max(1, Number(maker.workers) || 1);
      const baseMin = Number(maker.baseMinPerOrder) || 45;
      return baseMin + Math.round((queueCount * 45) / workers);
    }

    function formatWaitLabel(minutes) {
      if (minutes <= 45) return `Ready in ~${minutes} mins`;
      if (minutes < 120) return `Ready in ~1.5 hours`;
      const hours = Math.round(minutes / 60);
      if (hours < 8) return `Ready in ~${hours} hours`;
      if (hours <= 24) return `Ready Today, evening`;
      const days = Math.round(hours / 24);
      return `Ready in ~${days} ${days === 1 ? 'day' : 'days'}`;
    }

    function formatTimeRemaining(readyAt) {
      const diff = Math.max(0, readyAt - Date.now());
      if (diff <= 0) return 'Ready for pickup!';
      const h = Math.floor(diff / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      return `${String(h).padStart(2, '0')}h ${String(m).padStart(2, '0')}m ${String(s).padStart(2, '0')}s`;
    }

    function currentUser() {
      return db.users.find(u => u.id === db.currentUser);
    }

    function isMaker() {
      const u = currentUser();
      return u && u.role === 'maker';

    /* ==========================================================================

       ========================================================================== */
    function renderCustomerOrdersPage() {
      const u = currentUser();
      const myOrders = db.orders.filter(o => o.customerId === u.id);

      return `
        <div class="section-head">
          <div>
            <h2 style="font-family:var(--font-serif);font-size:26px;">My Live Orders &amp; Queue Tracker</h2>
            <p style="color:var(--ink-muted);font-size:13px;">Real-time workbench status and countdown</p>
          </div>
          <button class="btn btn-gold btn-sm" onclick="navigate('discover')">+ Request Another Piece</button>
        </div>

        ${!myOrders.length ? `
          <div style="background:var(--paper);border:1px dashed var(--line);border-radius:var(--radius);padding:40px;text-align:center;">
            <p style="font-family:var(--font-serif);font-size:18px;">No active orders yet</p>
            <button class="btn btn-gold" style="margin-top:12px;" onclick="navigate('discover')">Browse Artisans</button>
          </div>
        ` : `
          <div style="display:flex;flex-direction:column;gap:18px;">
            ${myOrders.map(o => {
              const maker = db.makers.find(m => m.id === o.makerId);
              const steps = ['Requested', 'Accepted', 'In progress', 'Ready', 'Collected'];
              const idx = steps.indexOf(o.status);
              const pct = idx === -1 ? 15 : Math.round(((idx + 1) / steps.length) * 100);

              return `
                <div class="workbench-pipeline">
                  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;">
                    <div>
                      <h3 style="font-family:var(--font-serif);font-size:20px;">${escapeHtml(o.service)}</h3>
                      <small style="color:var(--ink-muted);">Artisan: <b>${escapeHtml(maker?.name || 'Maker')}</b> · Order #${o.id}</small>
                    </div>
                    <div style="text-align:right;">
                      <b style="font-family:var(--font-serif);font-size:20px;color:var(--royal-emerald);">₹${o.amount}</b>
                      <span class="kyc-verified-badge" style="display:block;margin-top:2px;">${o.paymentStatus === 'Paid' ? '✓ Paid' : 'Payment at Pickup'}</span>
                    </div>
                  </div>

                  <div class="tracker-bar-bg">
                    <div class="tracker-bar-fill" style="width:${pct}%;"></div>
                  </div>
                  <div class="milestones-steps">
                    ${steps.map((s, i) => `<span class="${i < idx ? 'done' : i === idx ? 'current' : ''}">${i+1}. ${s}</span>`).join('')}
                  </div>

                  <div style="background:var(--bg);border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;margin-top:14px;">
                    <div>
                      <span style="font-size:10px;text-transform:uppercase;color:var(--ink-muted);font-weight:700;">Status</span>
                      <b style="display:block;font-size:13px;">${o.status === 'Ready' ? '🎉 Ready for pickup!' : o.status === 'In progress' ? 'Artisan crafting on workbench' : o.status}</b>
                    </div>
                    <div style="text-align:right;">
                      <span style="font-size:10px;text-transform:uppercase;color:var(--ink-muted);font-weight:700;">Time Remaining</span>
                      <b style="font-family:var(--font-serif);color:var(--royal-gold);font-size:15px;" id="countdown-${o.id}">
                        ${o.readyAt ? formatTimeRemaining(o.readyAt) : 'Calculating...'}
                      </b>
                    </div>
                  </div>

                  <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px;">
                    ${o.status === 'Ready' ? `
                      <button class="btn btn-emerald btn-sm" onclick="markOrderCollected('${o.id}')">Confirm Picked Up</button>
                    ` : ''}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `}
      `;
    }

    /* ==========================================================================
       SCREEN 5: MAKER STUDIO DASHBOARD (Requirement 1, 4)

    function renderMakerStudioPage() {
      const shop = myShop();
      if (!shop) return `<p>No shop registered for this maker.</p>`;

      const makerOrders = db.orders.filter(o => o.makerId === shop.id);
      const totalRevenue = makerOrders.reduce((sum, o) => sum + (o.paymentStatus === 'Paid' ? o.amount : 0), 1200);
      const totalCost = Math.round(totalRevenue * 0.38);
      const margin = totalRevenue - totalCost;

      return `
        <div class="studio-dashboard">
          <div class="section-head">
            <div>
              <div style="display:flex;align-items:center;gap:10px;">
                <h2 style="font-family:var(--font-serif);font-size:26px;">Atelier Studio · ${escapeHtml(shop.name)}</h2>
                <span class="kyc-verified-badge">✓ ${shop.kyc.badge}</span>
              </div>
              <p style="color:var(--ink-muted);font-size:13px;">Workbench live queue, incoming requests and demand metrics</p>
            </div>
            <div style="display:flex;gap:8px;">
              <button class="btn ${shop.paused ? 'btn-coral' : 'btn-outline'}" onclick="toggleShopPause('${shop.id}')">
                ${shop.paused ? 'Resume Receiving Requests' : 'Pause New Orders'}
              </button>
              <button class="btn btn-gold btn-sm" onclick="navigate('catalog')">+ Manage Catalog</button>
            </div>
          </div>

          <!-- Quick Stats -->
          <div class="stats-row">
            <div class="stat-card">
              <span>Queue Size</span>
              <b>${shop.queue}</b>
              <small>Wait: ${formatWaitLabel(calculateMakerWaitMinutes(shop))}</small>
            </div>
            <div class="stat-card">
              <span>Active Jobs</span>
              <b>${makerOrders.filter(o => o.status !== 'Collected').length}</b>
              <small>Across workbench</small>
            </div>
            <div class="stat-card">
              <span>7-Day Gross Margin</span>
              <b style="color:var(--royal-emerald);">₹${margin}</b>
              <small>Revenue: ₹${totalRevenue}</small>
            </div>
            <div class="stat-card">
              <span>Artisans on Bench</span>
              <b>${shop.workers}</b>
              <small>Capacity: ~${shop.workers * 6} orders/day</small>
            </div>
          </div>

          <!-- Workbench Conveyor Pipeline -->
          <div class="workbench-pipeline">
            <h3 style="font-family:var(--font-serif);font-size:20px;margin-bottom:6px;">Live Workbench Slots</h3>
            <p style="font-size:12px;color:var(--ink-muted);">Visualized job movement from queue to bench</p>

            <div class="workbench-slots">
              <div class="workbench-slot slot-active">
                <div style="font-size:10px;text-transform:uppercase;color:var(--royal-gold);font-weight:700;display:flex;justify-content:space-between;">
                  <span>Slot #1: On Bench</span>
                  <span class="craft-anim-pulse">⚡ Active Craft</span>
                </div>
                <b style="font-family:var(--font-serif);font-size:15px;display:block;margin:4px 0;">Work In Progress</b>
                <small style="color:var(--ink-muted);font-size:11px;">Artisans currently structuring garment seams</small>
              </div>

              <div class="workbench-slot">
                <div style="font-size:10px;text-transform:uppercase;color:var(--ink-muted);font-weight:700;">Slot #2: Next in Queue</div>
                <b style="font-family:var(--font-serif);font-size:15px;display:block;margin:4px 0;">Staging &amp; Prep</b>
                <small style="color:var(--ink-muted);font-size:11px;">Pattern matching and cutting prepared</small>
              </div>

              <div class="workbench-slot">
                <div style="font-size:10px;text-transform:uppercase;color:var(--ink-muted);font-weight:700;">Capacity Window</div>
                <b style="font-family:var(--font-serif);font-size:15px;display:block;margin:4px 0;color:var(--royal-emerald);">${formatWaitLabel(calculateMakerWaitMinutes(shop))}</b>
                <small style="color:var(--ink-muted);font-size:11px;">Calculated live for neighbours</small>
              </div>
            </div>
          </div>

          <!-- Active Orders Workflow Management -->
          <div class="workbench-pipeline">
            <h3 style="font-family:var(--font-serif);font-size:20px;margin-bottom:12px;">Active Job Orders (${makerOrders.length})</h3>

            ${!makerOrders.length ? '<p style="color:var(--ink-muted);">Workbench is currently clear.</p>' : `
              <div style="display:flex;flex-direction:column;gap:12px;">
                ${makerOrders.map(o => `
                  <div style="background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
                    <div>
                      <div style="display:flex;align-items:center;gap:8px;">
                        <b style="font-family:var(--font-serif);font-size:16px;">${escapeHtml(o.service)}</b>
                        <span class="kyc-verified-badge">${o.status}</span>
                      </div>
                      <small style="color:var(--ink-muted);font-size:12px;">Customer: <b>${escapeHtml(o.customerName)}</b> · ₹${o.amount}</small>
                      ${o.note ? `<div style="font-size:11px;color:var(--ink);margin-top:4px;">Details: "${escapeHtml(o.note)}"</div>` : ''}
                    </div>

                    <div style="display:flex;gap:6px;">
                      ${o.status === 'Requested' ? `
                        <button class="btn btn-emerald btn-sm" onclick="updateOrderStatus('${o.id}', 'Accepted')">Accept</button>

                        <button class="btn btn-outline btn-sm" onclick="updateOrderStatus('${o.id}', 'Collected')">Mark Collected</button>
                      ` : ''}
                      ${o.status === 'Collected' ? `
                        <span style="font-size:12px;color:var(--royal-emerald);font-weight:700;">✓ Completed</span>
                      ` : ''}
                    </div>
                  </div>
                `).join('')}
              </div>
            `}
          </div>
        </div>
      `;

          </div>

          <div class="workbench-pipeline">
            <div style="display:flex;align-items:center;gap:18px;margin-bottom:20px;">
              <div style="width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg, var(--royal-emerald) 0%, #155E49 100%);color:#FFF;display:grid;place-items:center;font-family:var(--font-serif);font-size:26px;border:2px solid var(--royal-gold);">
                ${u.name.charAt(0)}
              </div>
              <div>
                <h3 style="font-family:var(--font-serif);font-size:22px;">${escapeHtml(u.name)}</h3>
                <p style="color:var(--ink-muted);font-size:13px;">${escapeHtml(u.email)} · ${escapeHtml(u.phone)}</p>
                <div style="margin-top:6px;">
                  <span class="kyc-verified-badge">✓ KYC Status: ${u.kycBadge || 'Verified'}</span>
                </div>
              </div>
            </div>

            <div style="border-top:1px solid var(--line);padding-top:16px;">
              <b style="font-size:12px;text-transform:uppercase;color:var(--ink-muted);">Account Type:</b>
              <p style="font-size:15px;margin-top:2px;"><b>${u.role === 'maker' ? 'Artisan Maker Atelier' : 'Neighbourhood Customer'}</b></p>
            </div>

            ${shop ? `
              <div style="border-top:1px solid var(--line);padding-top:16px;margin-top:16px;">
                <b style="font-size:12px;text-transform:uppercase;color:var(--ink-muted);">Registered Shop Details:</b>
                <p style="font-size:14px;margin-top:4px;"><b>${escapeHtml(shop.name)}</b> (${shop.craft})<br>📍 ${shop.address}</p>
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    /* Screen: Invoices */
    function renderInvoicePage() {
      const order = db.orders[0];
      const maker = db.makers[0];

      return `
        <div style="max-width:720px;margin:0 auto;">
          <div class="section-head">
            <div>
              <h2 style="font-family:var(--font-serif);font-size:26px;">Order Invoice &amp; Payment</h2>
              <p style="color:var(--ink-muted);font-size:13px;">Digital receipt for completed order</p>
            </div>
            <button class="btn btn-outline btn-sm" onclick="window.print()">🖨 Print</button>
          </div>

          <div class="workbench-pipeline" style="padding:32px;">
            <div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:18px;">
              <div>
                <div class="brand-title">Craft<span>Pulse</span></div>
                <small style="color:var(--ink-muted);">Neighbourhood Artisan Network</small>
              </div>
              <div style="text-align:right;">
                <b>INVOICE #${order?.id || '101'}</b>
                <small style="display:block;color:var(--ink-muted);">${new Date().toLocaleDateString()}</small>
              </div>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:18px;">
              <div>
                <small style="color:var(--ink-muted);font-weight:700;">FROM:</small>
                <p><b>${escapeHtml(maker.name)}</b><br>${maker.address}</p>
              </div>
              <div>
                <small style="color:var(--ink-muted);font-weight:700;">BILLED TO:</small>
                <p><b>${escapeHtml(currentUser()?.name || 'Customer')}</b><br>Indiranagar, Bengaluru</p>
              </div>
            </div>

            <div style="display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);">
              <span>Item / Service: <b>${escapeHtml(order?.service || 'Custom Kurta')}</b></span>
              <b>₹${order?.amount || 450}</b>
            </div>

            <div style="display:flex;justify-content:space-between;padding:12px 0;border-top:2px solid var(--line);font-size:18px;">
              <span>Total Paid</span>
              <b style="color:var(--royal-emerald);">₹${order?.amount || 450}</b>
            </div>
          </div>
        </div>
      `;
    }

    /* ==========================================================================
       MODALS: CUSTOM ORDER, ADD PRODUCT, REJECT ORDER
       ========================================================================== */
    function openOrderModal(makerId, prefilledService = '', prefilledPrice = null) {
      const m = db.makers.find(x => x.id === makerId);
      if (!m) return;

      const modal = document.getElementById('modal-content');
      modal.innerHTML = `
        <div class="modal-head">
          <div>
            <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--royal-gold);">Custom Craft Request</div>
            <h2>Order from ${escapeHtml(m.name)}</h2>
          </div>
          <button class="modal-close" onclick="closeModal()">×</button>
        </div>

        <form onsubmit="handleOrderSubmit(event, '${m.id}')">
          <div class="form-group">
            <label>Service or Product</label>
            <input type="text" name="service" class="form-control" required value="${escapeHtml(prefilledService || (m.products?.[0]?.title || 'Custom Service'))}">
          </div>

          <div class="form-group">
            <label>Estimated Amount (₹)</label>
            <input type="number" name="amount" class="form-control" required value="${prefilledPrice || m.startingRate}" min="50">
          </div>

          <div class="form-group">
            <label>Date Needed</label>
            <input type="date" name="date" class="form-control" required min="${new Date().toISOString().split('T')[0]}" value="${new Date(Date.now() + 86400000).toISOString().split('T')[0]}">
          </div>

          <div class="form-group">
            <label>Details &amp; Measurements for Artisan</label>
            <textarea name="note" class="form-control" placeholder="Size, measurements, fabric details, special requests..."></textarea>
          </div>

          <button type="submit" class="btn btn-gold" style="width:100%;margin-top:8px;">
            Send Request to Artisan Atelier →
          </button>
        </form>
      `;
      document.getElementById('modal-container').classList.add('show');
    }

    function handleOrderSubmit(e, makerId) {
      e.preventDefault();
      const form = e.target;
      const u = currentUser();
      const m = db.makers.find(x => x.id === makerId);
      const waitMin = calculateMakerWaitMinutes(m);

      const newOrder = {
        id: 'ord-' + Date.now().toString().slice(-4),
        makerId: makerId,
        customerId: u.id,
        customerName: u.name,
        service: form.service.value,
        amount: Number(form.amount.value),
        note: form.note.value,
        status: 'Requested',
        created: Date.now(),
        estimatedMinutes: waitMin,
        readyAt: Date.now() + (waitMin * 60000),
        paymentStatus: 'Unpaid'
      };

      db.orders.unshift(newOrder);
      if (m) m.queue = (Number(m.queue) || 0) + 1;
      saveDatabase();
      closeModal();
      showToast('Order sent to atelier workbench queue!');
      navigate('orders');
    }

    function openAddProductModal(makerId) {
      const modal = document.getElementById('modal-content');
      modal.innerHTML = `
        <div class="modal-head">
          <div>
            <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--royal-gold);">Catalog Management</div>
            <h2>Add Piece to Storefront</h2>
          </div>
          <button class="modal-close" onclick="closeModal()">×</button>
        </div>

        <form onsubmit="handleAddProductSubmit(event, '${makerId}')">
          <div class="form-group">
            <label>Piece Title</label>
            <input type="text" name="title" class="form-control" required placeholder="e.g. Silk Anarkali, Chelsea Boot Resole">
          </div>

          <div class="form-group">
            <label>Price (₹)</label>
            <input type="number" name="price" class="form-control" required min="50" placeholder="e.g. 650">
          </div>

          <div class="form-group">
            <label>Description &amp; Materials</label>
            <textarea name="desc" class="form-control" required placeholder="Craft techniques, fabric, care instructions..."></textarea>
          </div>

          <button type="submit" class="btn btn-gold" style="width:100%;">
            Publish to Catalog →
          </button>
        </form>
      `;
      document.getElementById('modal-container').classList.add('show');
    }

    function handleAddProductSubmit(e, makerId) {
      e.preventDefault();
      const form = e.target;
      const m = db.makers.find(x => x.id === makerId);
      if (m) {
        if (!m.products) m.products = [];
        m.products.push({
          id: 'p-' + Date.now().toString().slice(-4),
          title: form.title.value,
          price: Number(form.price.value),
          timeMin: 60,
          desc: form.desc.value,
          photo: 'https://images.unsplash.com/photo-1558769132-cb1aea458c5e?w=500&auto=format&fit=crop&q=80'
        });
        saveDatabase();
      }
      closeModal();
      showToast('New piece added to atelier catalog!');
      renderCurrentPage();
    }

    function openRejectOrderModal(orderId) {
      const modal = document.getElementById('modal-content');
      modal.innerHTML = `
        <div class="modal-head">
          <h2>Decline Order Request</h2>
          <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <p style="font-size:13px;color:var(--ink-muted);margin-bottom:14px;">Select reason for decline:</p>
        <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px;">
          <label><input type="radio" name="rej_reason" value="Too busy" checked> Workbench queue is currently full</label>
          <label><input type="radio" name="rej_reason" value="Out of fabric"> Out of required materials / fabric</label>
          <label><input type="radio" name="rej_reason" value="Closed"> Shop closed for maintenance</label>
          <label><input type="radio" name="rej_reason" value="Other"> Other custom reason</label>
        </div>
        <button class="btn btn-coral" style="width:100%;" onclick="confirmReject('${orderId}')">Confirm Decline</button>
      `;
      document.getElementById('modal-container').classList.add('show');
    }

    function confirmReject(orderId) {
      const sel = document.querySelector('input[name="rej_reason"]:checked')?.value || 'Other';
      const o = db.orders.find(x => x.id === orderId);
      if (o) {
        o.status = 'Rejected';
        const m = db.makers.find(x => x.id === o.makerId);
        if (m) m.queue = Math.max(0, (Number(m.queue) || 0) - 1);
        saveDatabase();
        closeModal();
        showToast(`Request declined: ${sel}`);
        renderCurrentPage();
      }
    }

    function updateOrderStatus(orderId, newStatus) {
      const o = db.orders.find(x => x.id === orderId);
      if (o) {
        o.status = newStatus;
        if (newStatus === 'Accepted') {
          o.acceptedAt = Date.now();
          o.readyAt = Date.now() + (o.estimatedMinutes * 60000);
        } else if (newStatus === 'Ready') {
          o.readyAt = Date.now();
          const m = db.makers.find(x => x.id === o.makerId);
          if (m) m.queue = Math.max(0, (Number(m.queue) || 0) - 1);
        } else if (newStatus === 'Collected') {
          o.collectedAt = Date.now();
        }
        saveDatabase();
        showToast(`Status updated: ${newStatus}`);
        renderCurrentPage();
      }
    }

    function markOrderCollected(orderId) {
      updateOrderStatus(orderId, 'Collected');
    }

    function closeModal() {
      document.getElementById('modal-container').classList.remove('show');
    }

    /* Filters */
    function setCategoryFilter(cat) {
      categoryFilter = cat;
      renderCurrentPage();
    }

    function setRateTierFilter(tier) {
      rateTierFilter = tier;
      renderCurrentPage();
    }

    function handleSearch(val) {
      searchQuery = val;
      renderCurrentPage();
    }

    function handlePriceSlider(val) {
      maxPriceSlider = Number(val);
      renderCurrentPage();
    }

    function handleSortChange(val) {
      sortMode = val;
      renderCurrentPage();
    }

    function toggleSaveMaker(id) {
      if (db.savedMakers.includes(id)) {
        db.savedMakers = db.savedMakers.filter(x => x !== id);
        showToast('Removed from saved');
      } else {
        db.savedMakers.push(id);
        showToast('Atelier saved to favourites ♥');
      }
      saveDatabase();
      renderCurrentPage();
    }

    function toggleShopPause(makerId) {
      const m = db.makers.find(x => x.id === makerId);
      if (m) {
        m.paused = !m.paused;
        saveDatabase();
        showToast(m.paused ? 'New requests paused' : 'Shop open for orders');
        renderCurrentPage();
      }
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      db.theme = next;
      saveDatabase();
      document.getElementById('theme-icon').textContent = next === 'dark' ? '☀' : '☾';
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      const text = document.getElementById('toast-text');
      if (t && text) {
        text.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2800);
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /* Live Countdown Interval */
    setInterval(() => {
      if (currentPage === 'orders') {
        db.orders.forEach(o => {
          const el = document.getElementById(`countdown-${o.id}`);
          if (el && o.readyAt) {
            el.textContent = formatTimeRemaining(o.readyAt);
          }
        });
      }
    }, 1000);

    /* Initialize */
    if (db.theme) {
      document.documentElement.setAttribute('data-theme', db.theme);
      document.getElementById('theme-icon').textContent = db.theme === 'dark' ? '☀' : '☾';
    }
    renderCurrentPage();
  </script>
</body>
</html>
