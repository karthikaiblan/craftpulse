<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CraftPulse · Royal Neighbourhood Makers & Live Craft Queue</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       ROYAL DESIGN SYSTEM: IMPERIAL EMERALD, BURNISHED GOLD & OBSIDIAN
       ========================================================================== */
    :root {
      --bg: #F8F5EE;
      --paper: #FFFFFF;
      --card-bg: #FFFFFF;
      --ink: #111A16;
      --ink-muted: #53635B;
      --line: #E2DAC6;
      --line-subtle: #EDE6D8;
      
      /* Royal Imperial Emerald */
      --royal-emerald: #0A3D2E;
      --royal-emerald-dark: #06261D;
      --royal-emerald-light: #E1EFEA;
      --royal-emerald-glow: rgba(10, 61, 46, 0.25);

      /* Burnished Royal Gold */
      --royal-gold: #C59B27;
      --royal-gold-light: #F9F2DC;
      --royal-gold-bright: #E5B83B;
      --royal-gold-glow: rgba(197, 155, 39, 0.35);

      /* Warm Accent */
      --royal-copper: #C85A2A;
      --royal-copper-light: #FCECE4;
      
      --shadow-sm: 0 4px 12px rgba(10, 38, 29, 0.06);
      --shadow: 0 12px 32px rgba(10, 38, 29, 0.09);
      --shadow-lg: 0 24px 50px rgba(10, 38, 29, 0.16);
      --radius-sm: 8px;
      --radius: 16px;
      --radius-lg: 24px;
      --radius-pill: 9999px;
      --font-serif: 'Fraunces', Georgia, serif;
      --font-sans: 'DM Sans', system-ui, -apple-system, sans-serif;
      --transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      color-scheme: light;
    }

    html[data-theme="dark"] {
      --bg: #0C1210;
      --paper: #141D1A;
      --card-bg: #16221E;
      --ink: #F4EFE6;
      --ink-muted: #A1B2AA;
      --line: #273630;
      --line-subtle: #1C2723;

      --royal-emerald: #3DB88F;
      --royal-emerald-dark: #0A3D2E;
      --royal-emerald-light: #163328;
      --royal-emerald-glow: rgba(61, 184, 143, 0.3);

      --royal-gold: #E5B83B;
      --royal-gold-light: #2C2613;
      --royal-gold-bright: #FFD566;
      --royal-gold-glow: rgba(229, 184, 59, 0.35);

      --royal-copper: #E67A4D;
      --royal-copper-light: #381E15;

      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.3);
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      --shadow-lg: 0 24px 50px rgba(0, 0, 0, 0.6);
      color-scheme: dark;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.55;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 72px; /* space for mobile nav */
    }

    @media (min-width: 769px) {
      body { padding-bottom: 0; }
    }

    button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: transparent; }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; object-fit: cover; }
    .serif { font-family: var(--font-serif); }

    /* Keyframe Animations */
    @keyframes marqueeScroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    @keyframes goldShimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.75; }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ==========================================================================
       ROYAL TOP NAVIGATION BAR
       ========================================================================== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(248, 245, 238, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      padding: 12px 4vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      transition: background 0.3s ease;
    }
    html[data-theme="dark"] .topbar {
      background: rgba(12, 18, 16, 0.94);
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .brand-logo-mark {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--royal-emerald) 0%, #155E49 100%);
      color: #FFF;
      border-radius: 14px;
      display: grid;
      place-items: center;
      box-shadow: 0 4px 16px var(--royal-emerald-glow);
      border: 1px solid rgba(229, 184, 59, 0.3);
      transition: transform 0.25s ease;
      flex-shrink: 0;
    }
    .brand-wrap:hover .brand-logo-mark {
      transform: scale(1.05) rotate(-3deg);
    }
    .brand-title {
      font-family: var(--font-serif);
      font-size: 23px;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .brand-title span { color: var(--royal-gold); }
    .brand-sub {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--ink-muted);
      font-weight: 700;
      margin-top: 3px;
    }

    /* Desktop Navigation links */
    .nav-links-scroll {
      display: none;
      align-items: center;
      gap: 8px;
    }
    @media (min-width: 769px) {
      .nav-links-scroll { display: flex; }
    }

    .nav-btn {
      padding: 9px 18px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-muted);
      background: var(--paper);
      border: 1px solid var(--line);
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .nav-btn:hover {
      color: var(--ink);
      border-color: var(--royal-gold);
      transform: translateY(-1px);
    }
    .nav-btn.active {
      background: linear-gradient(135deg, var(--royal-emerald) 0%, #145945 100%);
      color: #FFF;
      border-color: var(--royal-emerald);
      box-shadow: 0 4px 14px var(--royal-emerald-glow);
    }
    html[data-theme="dark"] .nav-btn.active {
      color: #051A13;
      background: linear-gradient(135deg, #4EDB9F 0%, #3DB88F 100%);
      border-color: #3DB88F;
    }

    .top-tools {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .tool-btn {
      padding: 8px 13px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
      white-space: nowrap;
    }
    .tool-btn:hover {
      border-color: var(--royal-gold);
      background: var(--royal-gold-light);
    }

    .user-session-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--royal-gold-light);
      border: 1px solid var(--royal-gold);
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 700;
      color: var(--ink);
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Independent Device Indicator & Quick Switch Pill */
    .device-indicator-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--royal-gold-light);
      border: 1.5px solid var(--royal-gold);
      padding: 6px 13px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 700;
      color: var(--ink);
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
      user-select: none;
    }
    .device-indicator-pill:hover {
      background: var(--paper);
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }
    .device-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--royal-emerald);
      box-shadow: 0 0 8px var(--royal-emerald);
      flex-shrink: 0;
      animation: pulseGlow 2s infinite ease-in-out;
    }
    .device-switch-tag {
      font-size: 10px;
      background: var(--royal-gold);
      color: #111A16;
      padding: 1px 7px;
      border-radius: 8px;
      margin-left: 2px;
      font-weight: 800;
    }

    /* Device Chooser Screen */
    .device-role-wrap {
      max-width: 860px;
      margin: 30px auto;
      padding: 10px;
      animation: fadeInUp 0.4s ease;
    }
    .device-hero-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .device-badge-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--royal-gold-light);
      border: 1px solid var(--royal-gold);
      color: var(--royal-gold-dark, #AA820A);
      padding: 4px 14px;
      border-radius: var(--radius-pill);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
    }
    .device-choices-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }
    .device-card-option {
      background: var(--paper);
      border: 1.5px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: var(--transition);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
    }
    .device-card-option:hover {
      border-color: var(--royal-gold);
      transform: translateY(-4px);
      box-shadow: var(--shadow);
    }
    .device-card-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 22px;
      margin-bottom: 14px;
      border: 1px solid var(--line);
      background: var(--bg);
    }

    /* ==========================================================================
       MOBILE BOTTOM NAVIGATION BAR (Requirement 6)
       ========================================================================== */
    .mobile-bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: var(--paper);
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-around;
      padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
      box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
    }
    @media (min-width: 769px) {
      .mobile-bottom-nav { display: none !important; }
    }

    .mob-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 6px 2px;
      border-radius: 10px;
      color: var(--ink-muted);
      font-size: 10.5px;
      font-weight: 600;
      transition: var(--transition);
    }
    .mob-nav-item.active {
      color: var(--royal-gold);
      background: var(--royal-gold-light);
      font-weight: 700;
    }
    .mob-nav-item svg { margin-bottom: 2px; }

    /* ==========================================================================
       LAYOUT & CONTAINERS
       ========================================================================== */
    .wrap {
      max-width: 1260px;
      width: 100%;
      margin: 0 auto;
      padding: 22px 18px 60px;
      flex: 1;
      animation: fadeInUp 0.4s ease;
    }

    /* Royal Hero Banner */
    .royal-hero {
      background: linear-gradient(135deg, #072B20 0%, #0F4534 50%, #0A1B16 100%);
      color: #FFF;
      border-radius: var(--radius-lg);
      padding: 36px 36px 24px;
      margin-bottom: 26px;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid rgba(229, 184, 59, 0.25);
    }
    .hero-gold-glow {
      position: absolute;
      top: -100px;
      right: -100px;
      width: 360px;
      height: 360px;
      background: radial-gradient(circle, rgba(229, 184, 59, 0.35) 0%, rgba(229, 184, 59, 0) 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    .hero-kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(229, 184, 59, 0.15);
      border: 1px solid rgba(229, 184, 59, 0.4);
      color: var(--royal-gold-bright);
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 16px;
    }
    .royal-hero h1 {
      font-family: var(--font-serif);
      font-size: clamp(28px, 4.2vw, 42px);
      line-height: 1.15;
      font-weight: 600;
      margin-bottom: 12px;
      max-width: 780px;
    }
    .royal-hero h1 em {
      font-style: italic;
      color: var(--royal-gold-bright);
    }
    .royal-hero p {
      font-size: 15px;
      color: #D3E0DA;
      max-width: 680px;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .hero-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    /* SCROLLING MAKER LOGOS MARQUEE (Requirement 1) */
    .maker-marquee-container {
      border-top: 1px solid rgba(229, 184, 59, 0.25);
      padding-top: 18px;
      margin-top: 12px;
      overflow: hidden;
      position: relative;
    }
    .maker-marquee-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--royal-gold-bright);
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .marquee-track-wrapper {
      width: 100%;
      overflow: hidden;
      display: flex;
      mask-image: linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%);
      -webkit-mask-image: linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%);
    }
    .marquee-track {
      display: flex;
      gap: 20px;
      width: max-content;
      animation: marqueeScroll 26s linear infinite;
    }
    .marquee-track:hover {
      animation-play-state: paused;
    }
    .marquee-maker-pill {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(229, 184, 59, 0.35);
      padding: 7px 16px 7px 8px;
      border-radius: var(--radius-pill);
      color: #FFF;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
    }
    .marquee-maker-pill:hover {
      background: rgba(229, 184, 59, 0.25);
      border-color: var(--royal-gold-bright);
      transform: translateY(-2px);
    }
    .marquee-logo-thumb {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #FFF;
      overflow: hidden;
      border: 2px solid var(--royal-gold);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .marquee-logo-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ==========================================================================
       FULL-SIZE VISUAL CATEGORY CARDS (Requirement 8)
       ========================================================================== */
    .market-filter-section {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 28px;
    }
    .filter-header-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .filter-header-title span {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--royal-gold);
    }

    .visual-category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }
    .visual-cat-card {
      position: relative;
      height: 140px;
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }
    .visual-cat-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow);
      border-color: var(--royal-gold);
    }
    .visual-cat-card.active {
      border-color: var(--royal-gold-bright);
      box-shadow: 0 0 0 3px var(--royal-gold-glow), var(--shadow);
    }
    .visual-cat-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }
    .visual-cat-card:hover .visual-cat-bg {
      transform: scale(1.08);
    }
    .visual-cat-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(6,38,29,0.2) 0%, rgba(6,38,29,0.85) 60%, rgba(6,38,29,0.98) 100%);
    }
    .visual-cat-content {
      position: absolute;
      inset: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #FFF;
      z-index: 2;
    }
    .visual-cat-badge {
      align-self: flex-end;
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(229, 184, 59, 0.4);
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      font-size: 11px;
      font-weight: 700;
      color: var(--royal-gold-bright);
    }
    .visual-cat-name {
      font-family: var(--font-serif);
      font-size: 15px;
      font-weight: 600;
      line-height: 1.25;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    }

    /* Creative Rate Tier Cards */
    .rate-tiers-row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .rate-tier-card {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: var(--transition);
    }
    .rate-tier-card:hover {
      border-color: var(--royal-gold);
      transform: translateY(-2px);
    }
    .rate-tier-card.active {
      background: var(--royal-gold-light);
      border-color: var(--royal-gold);
      box-shadow: 0 4px 12px var(--royal-gold-glow);
    }
    .tier-gem { font-size: 20px; }
    .tier-info b { display: block; font-size: 13px; }
    .tier-info span { font-size: 11px; color: var(--ink-muted); }

    /* Search & Sort Bar */
    .search-slider-bar {
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
      padding-top: 14px;
      border-top: 1px solid var(--line-subtle);
    }
    .search-input-wrap {
      flex: 1;
      min-width: 220px;
      position: relative;
    }
    .search-input {
      width: 100%;
      padding: 10px 14px 10px 36px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--line);
      background: var(--bg);
      font-size: 13.5px;
      color: var(--ink);
    }
    .search-input:focus {
      outline: none;
      border-color: var(--royal-gold);
      background: var(--paper);
    }
    .search-input-wrap::before {
      content: '🔍';
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 12px;
      opacity: 0.6;
    }

    /* ==========================================================================
       MAKER CARDS: FULL SIZE PHOTO WITH DETAILS ABOVE IMAGE (Requirement 7)
       ========================================================================== */
    .maker-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 24px;
    }
    .maker-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      display: flex;
      flex-direction: column;
    }
    .maker-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: var(--royal-gold);
    }

    /* Full size photo with details overlaid above the image */
    .maker-full-cover {
      position: relative;
      height: 260px;
      width: 100%;
      overflow: hidden;
      cursor: pointer;
    }
    .maker-full-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }
    .maker-card:hover .maker-full-img {
      transform: scale(1.06);
    }
    .maker-full-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(6,35,25,0.2) 0%, rgba(6,35,25,0.7) 45%, rgba(6,35,25,0.96) 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      color: #FFF;
    }

        startOrder: Object.freeze({ from: 'Accepted', to: 'In progress', actor: 'maker' }),

      function assertTransition(action, currentStatus, actor) {

        if (transition.actor !== actor) throw new Error(`Action ${action} is not permitted for actor: ${actor}`);
        const validFrom = Array.isArray(transition.from) ? transition.from : [transition.from];

      function timeToMinutes(val) {
        if (!val || typeof val !== 'string') return 540;

      function dayWindow(date, hours) {
        if (!hours || !Array.isArray(hours)) return null;
        const d = new Date(date);
        const entry = hours[d.getDay()];
        if (!entry || !entry.open || !entry.close) return null;
        const openM = timeToMinutes(entry.open);
        const closeM = timeToMinutes(entry.close);
        if (closeM <= openM) return null;
        const start = new Date(d);
        start.setHours(0, openM, 0, 0);
        const end = new Date(d);
        end.setHours(0, closeM, 0, 0);
        return { start, end };
      }

      function startOfNextDay(date) {
        const next = new Date(date);
        next.setDate(next.getDate() + 1);
        next.setHours(0, 0, 0, 0);
        return next;

      function nextOpen(time, hours) {
        let curr = new Date(time);
        for (let i = 0; i < 15; i++) {
          const w = dayWindow(curr, hours);
          if (w && curr < w.start) return w.start;
          if (w && curr < w.end) return curr;
          curr = startOfNextDay(curr);

        let curr = nextOpen(start, hours) || new Date(start);
        let remaining = Math.max(0, minutes);

          if (!w) {
            curr = nextOpen(startOfNextDay(curr), hours);
            continue;

          const available = (w.end.getTime() - curr.getTime()) / 60000;
          if (remaining <= available) {
            return new Date(curr.getTime() + (remaining * 60000));
          }
          remaining -= available;
          curr = nextOpen(startOfNextDay(w.end), hours);
        }
        return curr || new Date(new Date(start).getTime() + (minutes * 60000));

        const first = new Date(start);
        const last = new Date(end);
        if (isNaN(first.getTime()) || isNaN(last.getTime()) || first >= last) return 0;
        let curr = nextOpen(first, hours);
        let total = 0;
        let loops = 0;
        while (curr && curr < last && loops < 50) {

          const w = dayWindow(curr, hours);
          if (!w) {

          total += Math.max(0, (Math.min(last.getTime(), w.end.getTime()) - curr.getTime()) / 60000);

        let evenBit = true;
        let bit = 0;
        let character = 0;
        let result = '';

        while (result.length < precision) {
          if (evenBit) {
            const midpoint = (longitude[0] + longitude[1]) / 2;
            if (lng >= midpoint) {
              character = (character << 1) + 1;
              longitude[0] = midpoint;
            } else {
              character <<= 1;
              longitude[1] = midpoint;
            }
          } else {
            const midpoint = (latitude[0] + latitude[1]) / 2;
            if (lat >= midpoint) {
              character = (character << 1) + 1;
              latitude[0] = midpoint;
            } else {
              character <<= 1;
              latitude[1] = midpoint;
            }
          }
          evenBit = !evenBit;
          if (bit < 4) {
            bit += 1;
          } else {
            result += alphabet[character];
            bit = 0;
            character = 0;
          }
        }
        return result;
      }

      function recalculateMakerQueue(makerId) {
        if (!db) return;
        const maker = db.makers.find(m => m.id === makerId);
        if (!maker) return;
        const wait = estimateWait(maker, db.orders);
        maker.queue = wait.queueCount;
        maker.approxWaitText = formatApproxTiming(wait.queueClearsAt, maker.approxWaitText);
      }

      function recalculateMakerRating(makerId) {
        if (!db || !db.reviews) return;
        const maker = db.makers.find(m => m.id === makerId);
        if (!maker) return;
        const makerRevs = db.reviews.filter(r => r.providerId === makerId);
        if (makerRevs.length > 0) {
          const sum = makerRevs.reduce((acc, r) => acc + (Number(r.rating) || 5), 0);
          maker.ratingSum = sum;
          maker.ratingCount = makerRevs.length;
          maker.rating = Number((sum / makerRevs.length).toFixed(1));
          maker.reviewsCount = makerRevs.length;
        }
      }

      return {
        ORDER_STATUSES,
        TRANSITIONS,
        ACTIVE_STATUSES,
        assertTransition,
        dayWindow,
        nextOpen,
        addWorkingMinutes,
        workingMinutesBetween,
        serviceToMinutes,
        remainingMinutes,
        estimateWait,
        readyAtAcceptance,
        formatApproxTiming,
        encodeGeohash,
        recalculateMakerQueue,
        recalculateMakerRating
      };
    })();

      orders: {
        async create(input) {
          const u = currentUser();
          if (!u) throw new Error("Please sign in to place an order.");
          const provider = db.makers.find(m => m.id === input.providerId || m.id === input.makerId);
          if (!provider) throw new Error("Atelier not found.");

          const serviceDef = (provider.services || []).find(s => s.name.toLowerCase() === (input.service || '').toLowerCase());
          const serviceMinutes = serviceDef ? ZephyrDomain.serviceToMinutes(serviceDef, provider.workingHours) : (provider.baseMinPerOrder || 60);

          const newOrder = {
            id: 'ord-' + Date.now().toString().slice(-4),
            makerId: provider.id,
            providerId: provider.id,
            customerId: u.id,
            customerName: u.name,

            serviceMinutes: serviceMinutes,
            amount: Number(input.amount) || serviceDef?.price || provider.startingRate || 250,
            details: {
              materialsBy: input.details?.materialsBy || 'Customer',
              notes: input.details?.notes || input.note || '',
              size: input.details?.size || 'Standard',
              dateNeeded: input.details?.dateNeeded || ''
            },
            status: 'Requested',
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString(),
            approxTiming: provider.approxWaitText || 'Approx. 1–3 hrs',
            paymentStatus: 'Unpaid',
            paymentMethod: null
          };

          db.orders.unshift(newOrder);
          ZephyrDomain.recalculateMakerQueue(provider.id);
          saveDatabase();
          return { order: newOrder };
        },

        async acceptFixedPrice(orderId) {
          const o = db.orders.find(x => x.id === orderId);
          if (!o) throw new Error("Order not found");
          const provider = db.makers.find(m => m.id === o.makerId);
          ZephyrDomain.assertTransition('acceptFixedPrice', o.status, 'maker');
          const otherActives = db.orders.filter(x => x.makerId === o.makerId && ZephyrDomain.ACTIVE_STATUSES.has(x.status) && x.id !== o.id);
          const now = new Date();
          const estReadyDate = ZephyrDomain.readyAtAcceptance(provider, otherActives, o, now);
          o.status = 'Accepted';
          o.estReadyAt = estReadyDate ? estReadyDate.toISOString() : null;
          o.approxTiming = ZephyrDomain.formatApproxTiming(o.estReadyAt, provider?.approxWaitText);
          o.updatedAt = now.toISOString();
          ZephyrDomain.recalculateMakerQueue(o.makerId);
          saveDatabase();
          return { order: o };
        },

        async sendQuote(input) {
          const o = db.orders.find(x => x.id === input.orderId);
          if (!o) throw new Error("Order not found");
          ZephyrDomain.assertTransition('sendQuote', o.status, 'maker');
          o.status = 'Quoted';
          o.quotePrice = input.quotePrice;
          o.quoteTime = input.quoteTime;
          o.amount = input.quotePrice;

        async confirmQuote(orderId) {

          if (!o) throw new Error("Order not found");
          const provider = db.makers.find(m => m.id === o.makerId);
          ZephyrDomain.assertTransition('confirmQuote', o.status, 'customer');
          const otherActives = db.orders.filter(x => x.makerId === o.makerId && ZephyrDomain.ACTIVE_STATUSES.has(x.status) && x.id !== o.id);
          const now = new Date();
          const estReadyDate = ZephyrDomain.readyAtAcceptance(provider, otherActives, o, now);
          o.status = 'Accepted';
          o.estReadyAt = estReadyDate ? estReadyDate.toISOString() : null;
          o.approxTiming = ZephyrDomain.formatApproxTiming(o.estReadyAt, provider?.approxWaitText);
          o.updatedAt = now.toISOString();
          ZephyrDomain.recalculateMakerQueue(o.makerId);
          saveDatabase();
          return { order: o };
        },

        async start(orderId) {
          const o = db.orders.find(x => x.id === orderId);
          if (!o) throw new Error("Order not found");
          ZephyrDomain.assertTransition('startOrder', o.status, 'maker');
          const now = new Date();
          o.status = 'In progress';
          o.startedAt = now.toISOString();
          o.updatedAt = now.toISOString();
          ZephyrDomain.recalculateMakerQueue(o.makerId);
          saveDatabase();
          return { order: o };
        },

        async markReady(orderId) {
          const o = db.orders.find(x => x.id === orderId);
          if (!o) throw new Error("Order not found");
          ZephyrDomain.assertTransition('markReady', o.status, 'maker');
          const now = new Date();
          o.status = 'Ready';
          o.readyAt = now.toISOString();
          o.approxTiming = 'Ready Now';
          o.updatedAt = now.toISOString();
          ZephyrDomain.recalculateMakerQueue(o.makerId);
          triggerQueueExitAnimation(o.makerId);
          saveDatabase();
          return { order: o };
        },

        async markCollected(orderId) {
          const o = db.orders.find(x => x.id === orderId);
          if (!o) throw new Error("Order not found");
          ZephyrDomain.assertTransition('markCollected', o.status, 'maker');
          const now = new Date();
          o.status = 'Collected';
          o.collectedAt = now.toISOString();
          o.updatedAt = now.toISOString();
          ZephyrDomain.recalculateMakerQueue(o.makerId);
          saveDatabase();
          return { order: o };
        },

        async reject(input) {
          const id = typeof input === 'string' ? input : input.orderId;
          const o = db.orders.find(x => x.id === id);
          if (!o) throw new Error("Order not found");
          ZephyrDomain.assertTransition('rejectOrder', o.status, 'maker');
          const now = new Date();
          o.status = 'Rejected';
          o.rejectReason = input.rejectReason || 'Declined by artisan';
          o.updatedAt = now.toISOString();
          ZephyrDomain.recalculateMakerQueue(o.makerId);
          saveDatabase();
          return { order: o };
        },

        async cancel(orderId) {
          const o = db.orders.find(x => x.id === orderId);
          if (!o) throw new Error("Order not found");
          ZephyrDomain.assertTransition('cancelOrder', o.status, 'customer');
          const now = new Date();
          o.status = 'Cancelled';
          o.updatedAt = now.toISOString();
          ZephyrDomain.recalculateMakerQueue(o.makerId);
          saveDatabase();
          return { order: o };
        },

        subscribeOne(orderId, onData, onError) {
          const o = db.orders.find(x => x.id === orderId);
          if (onData) onData(o);
          return () => {};
        },
        subscribeCustomerOrders(onData, onError) {

          if (onData) onData(db.orders.filter(o => o.customerId === u?.id));

        subscribeMakerOrders(onData, onError) {

          if (onData) onData(db.orders.filter(o => o.makerId === m?.id));
          return () => {};
        }
      },

          const o = db.orders.find(x => x.id === input.orderId);
          if (!o) throw new Error("Order not found.");
          if (o.customerId !== u.id) throw new Error("Only the customer who placed this order may review it.");
          if (o.status !== 'Collected') throw new Error("Reviews unlock only after collection.");

          const provider = db.makers.find(m => m.id === o.makerId);
          if (!provider) throw new Error("Provider not found.");

          const revId = 'rev-' + Date.now().toString().slice(-4);
          const newRev = {
            id: revId,
            orderId: input.orderId,

            customerId: u.id,

            rating: Math.max(1, Math.min(5, Math.round(Number(input.rating) || 5))),
            text: (input.text || '').trim(),

          };

          if (!db.reviews) db.reviews = [];
          db.reviews.unshift(newRev);
          ZephyrDomain.recalculateMakerRating(provider.id);
          saveDatabase();
          return { review: newRev };
        },

        subscribeForProvider(providerId, onData, onError) {
          const revs = (db.reviews || []).filter(r => r.providerId === providerId);
          if (onData) onData(revs);
          return () => {};
        }

    /* ==========================================================================
       COMPACT ANIMATED HUMAN STANDING QUEUE SYSTEM (User Reference Feature)
       ========================================================================== */
    function renderCompactQueue(maker, activeUser) {
      if (!maker) return '';
      const waitEst = ZephyrDomain.estimateWait(maker, db.orders);
      const queueCount = waitEst.queueCount;

      // Check if logged-in customer has an active order with this maker
      const myOrder = activeUser ? db.orders.find(o => o.makerId === maker.id && o.customerId === activeUser.id && o.status !== 'Collected' && o.status !== 'Rejected') : null;

      let aheadCount = queueCount;
      if (myOrder) {
        const makerOrders = db.orders.filter(o => o.makerId === maker.id && o.status !== 'Collected' && o.status !== 'Rejected');
        const myIndex = makerOrders.findIndex(o => o.id === myOrder.id);
        aheadCount = myIndex === -1 ? 0 : myIndex;
      }

      // Generate human standing icons (up to 4 to stay sleek and compact like screenshot)
      let peopleHtml = '';
      if (queueCount === 0 && !myOrder) {
        peopleHtml = `
          <div style="font-size:11px;color:var(--royal-emerald);font-weight:700;display:flex;align-items:center;gap:4px;">
            <span>✓</span> <span>Open Queue · Instant Start</span>
          </div>
        `;
      } else {
        const numNodes = Math.min(4, Math.max(1, queueCount));
        for (let i = 1; i <= numNodes; i++) {
          const isUserNode = myOrder && (i === numNodes);
          peopleHtml += `
            <div class="queue-human-node ${isUserNode ? 'is-user' : ''}" id="qnode-${maker.id}-${i}">
              <svg class="queue-human-icon" viewBox="0 0 24 24" fill="currentColor">
                <circle cx="12" cy="4.5" r="2.5"/>
                <path d="M15 8.5H9c-1.1 0-2 .9-2 2v4.5c0 .55.45 1 1 1s1-.45 1-1V12h1v9c0 .55.45 1 1 1s1-.45 1-1v-6h1v6c0 .55.45 1 1 1s1-.45 1-1v-9h1v3c0 .55.45 1 1 1s1-.45 1-1v-4.5c0-1.1-.9-2-2-2z"/>
              </svg>
              <span class="queue-human-badge">${isUserNode ? 'YOU' : '#' + i}</span>
            </div>
          `;
        }
      }

      let caption = '';
      if (myOrder) {
        if (myOrder.status === 'Ready') {
          caption = `<span>🎉 Your order is <b>READY for pickup!</b></span>`;
        } else if (aheadCount === 0) {
          caption = `<span>⚡ You are <b>NEXT on the workbench!</b> (Slot #1)</span>`;
        } else {
          caption = `<span>👤 <b>${aheadCount} order${aheadCount > 1 ? 's' : ''} ahead of you</b> · time is approximate</span>`;
        }
      } else {
        if (queueCount === 0) {
          caption = `<span>Open queue · Check in or order anytime</span>`;
        } else {
          caption = `<span><b>${queueCount} order${queueCount > 1 ? 's' : ''} ahead</b> · time is approximate</span>`;
        }
      }

      return `
        <div class="compact-queue-widget" data-maker-queue="${maker.id}" id="queue-widget-${maker.id}">
          <div class="queue-rail-row">
            <span class="queue-end-label ${myOrder ? 'you-label' : ''}">YOU</span>
            <div class="queue-track-line">
              <div class="queue-rail-bar"></div>
              <div class="queue-human-line">
                ${peopleHtml}
              </div>
            </div>
            <span class="queue-end-label ready-label">READY</span>
          </div>
          <div class="queue-status-caption">
            ${caption}
          </div>
        </div>
      `;
    }

    function triggerQueueExitAnimation(makerId) {
      const nodes = document.querySelectorAll(`[data-maker-queue="${makerId}"] .queue-human-node`);
      if (nodes.length > 0) {
        nodes[0].classList.add('leaving');
      }
    }

    function simulateOrderCompletion(makerId) {
      const m = db.makers.find(x => x.id === makerId);
      if (!m) return;
      triggerQueueExitAnimation(makerId);
      setTimeout(() => {
        m.queue = Math.max(0, (Number(m.queue) || 0) - 1);
        const pending = db.orders.find(o => o.makerId === makerId && o.status !== 'Ready' && o.status !== 'Collected');
        if (pending) {
          pending.status = 'Ready';
        }
        saveDatabase();
        showToast(`Order completed by ${m.name}! Queue shifted forward.`);
        renderCurrentPage();
      }, 550);
    }

        }

        if (currentPage === 'discover') {

      authMode = mode;
      renderCurrentPage();

      signupRole = role;
      renderCurrentPage();

    function handleLoginSubmit(e) {
      e.preventDefault();
      const form = e.target;
      const email = form.email.value.trim().toLowerCase();
      const user = db.users.find(u => u.email.toLowerCase() === email);

      if (user) {
        setDeviceUserId(user.id);
        showToast(`This device is logged in as ${user.name}!`);
        navigate(user.role === 'maker' ? 'studio' : 'discover');
      } else {
        alert('Account not found with this email. Please check the spelling or switch to "Create Account".');
      }
    }

    function quickLoginDemo(userId) {
      setDeviceUserId(userId);
      const u = currentUser();
      showToast(`This device is now: ${u?.name || 'User'}`);
      navigate(u && u.role === 'maker' ? 'studio' : 'discover');
    }

    function handleLogout() {
      setDeviceUserId(null);
      showToast('This device has been signed out');
      navigate('device-select');
    }

    function handleSignupSubmit(e) {
      e.preventDefault();
      const form = e.target;
      const newId = 'user_' + Date.now().toString().slice(-5);
      const isNewMaker = signupRole === 'maker';

      const newUser = {
        id: newId,
        name: form.name.value,
        email: form.email.value,
        phone: form.phone.value,
        role: signupRole,
        kycStatus: 'Verified',
        kycBadge: isNewMaker ? `${form.docType.value} (Verified)` : 'Verified Patron'
      };

      if (isNewMaker) {
        const makerId = 'maker_' + Date.now().toString().slice(-4);
        newUser.makerId = makerId;

        const newMaker = {
          id: makerId,
          ownerId: newId,
          name: form.shopName.value,
          craft: form.craft.value,
          desc: `Artisanal ${form.craft.value} atelier established in Indiranagar.`,
          rating: 5.0,
          reviewsCount: 1,
          workers: 2,
          queue: 0,
          baseMinPerOrder: 45,
          approxWaitText: 'Approx. 1–2 hrs',
          startingRate: 200,
          distance: 0.5,
          address: form.address.value,
          city: 'Bengaluru',
          paused: false,
          logoImg: 'images/sneaker_footshop.jpg',
          coverPhoto: 'images/sneaker_simplicity.jpg',
          kyc: {
            status: 'Verified',
            docType: form.docType.value,
            docNumber: form.docNumber.value,
            badge: `${form.craft.value} Guild Verified`
          },
          products: [
            {
              id: 'p-' + Date.now(),
              title: 'Custom Handcrafted Service',
              price: 350,
              desc: 'Tailored craft piece made with precision materials.',
              photo: 'images/sneaker_footshop.jpg'
            }
          ]
        };
        db.makers.unshift(newMaker);
      }

      db.users.push(newUser);
      saveDatabase();
      setDeviceUserId(newId);
      showToast(`Welcome to CraftPulse, ${newUser.name}!`);
      navigate(isNewMaker ? 'studio' : 'discover');
    }

                      </div>
                      ${!(db.reviews || []).find(r => r.orderId === o.id) ? `
                        <button class="btn btn-gold btn-sm" onclick="openReviewModal('${o.id}')">★ Rate &amp; Review Atelier</button>
                      ` : `
                        <span style="color:var(--royal-gold);font-size:12px;font-weight:700;">✓ Reviewed ★</span>

          </div>
        `}

    /* ==========================================================================
       PAYMENT MODAL & INVOICE FLOW (Requirement 4)
       ========================================================================== */
    function openPaymentModal(orderId) {
      const o = db.orders.find(x => x.id === orderId);
      if (!o) return;
      const maker = db.makers.find(m => m.id === o.makerId);

      const modal = document.getElementById('modal-content');
      modal.innerHTML = `
        <div class="modal-head">
          <div>
            <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--royal-gold);">Order Payment &amp; Invoice Generation</div>

          </div>
          <button class="modal-close" onclick="closeModal()">×</button>
        </div>

        <div style="background:var(--bg);border-radius:12px;padding:14px;margin-bottom:18px;">
          <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
            <span style="color:var(--ink-muted);font-size:13px;">Item / Craft:</span>
            <b>${escapeHtml(o.service)}</b>
          </div>
          <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
            <span style="color:var(--ink-muted);font-size:13px;">Atelier:</span>
            <b>${escapeHtml(maker?.name || 'Maker')}</b>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:16px;border-top:1px solid var(--line);padding-top:8px;">
            <span>Total Payable:</span>
            <b style="color:var(--royal-emerald);">₹${o.amount}</b>
          </div>
        </div>

        <p style="font-size:13px;font-weight:700;margin-bottom:10px;">Select Payment Mode:</p>
        
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px;">
          <!-- Cash on Delivery Option -->
          <div style="border:2px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;text-align:center;transition:var(--transition);" onclick="selectPaymentOption('${o.id}', 'cod')" onmouseover="this.style.borderColor='var(--royal-gold)'" onmouseout="this.style.borderColor='var(--line)'">
            <div style="font-size:28px;margin-bottom:6px;">💵</div>
            <b style="font-size:14px;display:block;">Cash on Delivery</b>
            <small style="font-size:11px;color:var(--ink-muted);">Pay upon physical pickup / delivery</small>
          </div>

          <!-- Online Payment Option -->
          <div style="border:2px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;text-align:center;transition:var(--transition);" onclick="selectPaymentOption('${o.id}', 'online')" onmouseover="this.style.borderColor='var(--royal-gold)'" onmouseout="this.style.borderColor='var(--line)'">
            <div style="font-size:28px;margin-bottom:6px;">💳</div>
            <b style="font-size:14px;display:block;">Online Payment</b>
            <small style="font-size:11px;color:var(--ink-muted);">Instant UPI, QR Code, or Card</small>
          </div>
        </div>
      `;
      document.getElementById('modal-container').classList.add('show');
    }

    function selectPaymentOption(orderId, type) {
      const o = db.orders.find(x => x.id === orderId);
      if (!o) return;

      // CASH ON DELIVERY FLOW
      if (type === 'cod') {
        o.paymentMethod = 'Cash on Delivery';
        o.paymentStatus = 'COD';
        saveDatabase();
        showToast(`Cash on Delivery confirmed! Pay ₹${o.amount} upon pickup.`);
        closeModal();
        openInvoiceModal(orderId);
      } 
      // ONLINE PAYMENT FLOW (Proceeds to transaction step)
      else if (type === 'online') {
        openOnlineTransactionStep(orderId);
      }
    }

    function openOnlineTransactionStep(orderId) {
      const o = db.orders.find(x => x.id === orderId);
      if (!o) return;
      const maker = db.makers.find(m => m.id === o.makerId);

      const modal = document.getElementById('modal-content');
      modal.innerHTML = `
        <div class="modal-head">
          <div>
            <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--royal-gold);">Step 2: Instant Transaction</div>
            <h2>Scan &amp; Pay via UPI</h2>
          </div>
          <button class="modal-close" onclick="closeModal()">×</button>
        </div>

        <div style="text-align:center;padding:10px 0;">
          <!-- Mock QR Code -->
          <div style="width:180px;height:180px;margin:0 auto 14px;background:#FFF;border:2px dashed var(--royal-gold);border-radius:16px;display:grid;place-items:center;padding:12px;box-shadow:var(--shadow-sm);">
            <svg width="150" height="150" viewBox="0 0 24 24" fill="none" stroke="#0A3D2E" stroke-width="1.8">
              <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
              <rect x="6" y="6" width="1" height="1"/><rect x="17" y="6" width="1" height="1"/><rect x="6" y="17" width="1" height="1"/>
              <line x1="14" y1="14" x2="14" y2="21"/><line x1="17" y1="14" x2="21" y2="14"/><line x1="21" y1="17" x2="21" y2="21"/>
            </svg>
          </div>

          <p style="font-size:13px;color:var(--ink-muted);margin-bottom:12px;">Scan with <b>Google Pay, PhonePe, Paytm</b> to pay <b>₹${o.amount}</b> to ${escapeHtml(maker?.name)}</p>

          <button class="btn btn-emerald" style="width:100%;margin-bottom:8px;" onclick="completeOnlinePayment('${o.id}')">
            ✓ Simulate Successful Payment (₹${o.amount})
          </button>
          <button class="btn btn-outline btn-sm" style="width:100%;" onclick="openPaymentModal('${o.id}')">
            ← Back to Payment Options
          </button>
        </div>
      `;
    }

    function completeOnlinePayment(orderId) {
      const o = db.orders.find(x => x.id === orderId);
      if (!o) return;

      o.paymentMethod = 'Online UPI';
      o.paymentStatus = 'Paid';
      o.paidAt = Date.now();
      saveDatabase();
      showToast(`Payment of ₹${o.amount} Successful! Generating Invoice...`);
      closeModal();
      openInvoiceModal(orderId);
    }

            <div>
              <h2 style="font-family:var(--font-serif);font-size:26px;">My Profile</h2>
              <p style="color:var(--ink-muted);font-size:13px;">Account identity &amp; verification details</p>
            </div>
            <button class="btn btn-coral btn-sm" onclick="handleLogout()">Sign Out 🚪</button>
          </div>

          <div class="workbench-pipeline">
            <div style="display:flex;align-items:center;gap:18px;margin-bottom:20px;">
              <div style="width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg, var(--royal-emerald) 0%, #155E49 100%);color:#FFF;display:grid;place-items:center;font-family:var(--font-serif);font-size:26px;border:2px solid var(--royal-gold);">
                ${u.name.charAt(0)}
              </div>
              <div>
                <h3 style="font-family:var(--font-serif);font-size:22px;">${escapeHtml(u.name)}</h3>
                <p style="color:var(--ink-muted);font-size:13px;">${escapeHtml(u.email)} · ${escapeHtml(u.phone)}</p>
                <div style="margin-top:6px;">
                  <span class="kyc-verified-badge">✓ KYC Status: ${u.kycBadge || 'Verified'}</span>
                </div>
              </div>
            </div>

            <div style="border-top:1px solid var(--line);padding-top:16px;">
              <b style="font-size:12px;text-transform:uppercase;color:var(--ink-muted);">Account Role:</b>
              <p style="font-size:15px;margin-top:2px;"><b>${u.role === 'maker' ? 'Artisan Maker Atelier' : 'Neighbourhood Customer'}</b></p>
            </div>

            ${shop ? `
              <div style="border-top:1px solid var(--line);padding-top:16px;margin-top:16px;">
                <b style="font-size:12px;text-transform:uppercase;color:var(--ink-muted);">Registered Shop Details:</b>
                <p style="font-size:14px;margin-top:4px;"><b>${escapeHtml(shop.name)}</b> (${shop.craft})<br>📍 ${shop.address}</p>
                <small style="display:block;color:var(--royal-gold);margin-top:4px;">Badge: ${shop.kyc.badge} · ${shop.products?.length || 0} catalog piece(s)</small>
              </div>
            ` : ''}
          </div>

          <!-- Multi-Device Setup Card in Profile -->
          <div class="workbench-pipeline" style="margin-top:20px;">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;">
              <div>
                <h3 style="font-family:var(--font-serif);font-size:18px;">📱 Device Session &amp; Multi-Device Setup</h3>
                <p style="font-size:12px;color:var(--ink-muted);">Each phone, tablet, and computer runs independently on CraftPulse.</p>
              </div>
              <span class="kyc-verified-badge">Device ID: ${DEVICE_ID}</span>
            </div>

            <div style="background:var(--bg);border-radius:12px;padding:14px;margin-bottom:16px;font-size:13px;">
              <p><b>Current Device Mode:</b> ${u.role === 'maker' ? '✂ Artisan Maker Atelier' : '🧑 Neighbourhood Customer'}</p>
              <p style="color:var(--ink-muted);font-size:12px;margin-top:4px;">You can set this phone to be a Customer and your laptop to be a Maker Atelier, or run separate independent accounts simultaneously.</p>
            </div>

            <div style="display:flex;gap:10px;flex-wrap:wrap;">
              <button class="btn btn-gold btn-sm" onclick="openDeviceRoleModal()">
                🔄 Switch Device Role (Customer ⇄ Maker)
              </button>
              <button class="btn btn-outline btn-sm" onclick="resetDeviceSession()">
                🗑 Reset Device Session
              </button>
            </div>
          </div>
        </div>
      `;
    }

    /* Order Modals */
    function openOrderModal(makerId, prefilledService = '', prefilledPrice = null) {
      const m = db.makers.find(x => x.id === makerId);
      if (!m) return;

      const modal = document.getElementById('modal-content');
      modal.innerHTML = `
        <div class="modal-head">
          <div>
            <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--royal-gold);">Custom Request</div>
            <h2>Order from ${escapeHtml(m.name)}</h2>
          </div>
          <button class="modal-close" onclick="closeModal()">×</button>
        </div>

        <form onsubmit="handleOrderSubmit(event, '${m.id}')">
          <div class="form-group">
            <label>Piece or Service</label>
            <input type="text" name="service" class="form-control" required value="${escapeHtml(prefilledService || (m.products?.[0]?.title || 'Custom Piece'))}">
          </div>

          <div class="form-group">
            <label>Amount (₹)</label>
            <input type="number" name="amount" class="form-control" required value="${prefilledPrice || m.startingRate}" min="50">
          </div>

          <div class="form-group">
            <label>Special Instructions / Measurements</label>
            <textarea name="note" class="form-control" placeholder="Size, style details, fabric preferences..."></textarea>
          </div>

          <button type="submit" class="btn btn-gold" style="width:100%;margin-top:8px;">
            Send Request to Atelier →
          </button>
        </form>
      `;
      document.getElementById('modal-container').classList.add('show');
    }

    function handleOrderSubmit(e, makerId) {
      e.preventDefault();
      const form = e.target;
      const service = form.service.value;
      const amount = Number(form.amount.value);
      const note = form.note ? form.note.value : '';
      const materialsBy = form.materialsBy ? form.materialsBy.value : 'Customer';
      const size = form.size ? form.size.value : 'Standard';
      const dateNeeded = form.dateNeeded ? form.dateNeeded.value : '';

      localLoop.orders.create({
        providerId: makerId,
        service: service,
        amount: amount,
        details: {
          materialsBy: materialsBy,
          notes: note,
          size: size,
          dateNeeded: dateNeeded
        }
      }).then(() => {
        closeModal();
        showToast('Order sent to atelier workbench queue via LocalLoop!');
        navigate('orders');
      }).catch(err => {
        alert(err.message || 'Error creating order');
      });
    }

    function openAddProductModal(makerId) {
      const modal = document.getElementById('modal-content');
      modal.innerHTML = `
        <div class="modal-head">
          <h2>Add Piece to Catalog</h2>
          <button class="modal-close" onclick="closeModal()">×</button>
        </div>

        <form onsubmit="handleAddProductSubmit(event, '${makerId}')">
          <div class="form-group">
            <label>Piece Title</label>
            <input type="text" name="title" class="form-control" required placeholder="e.g. Leather Resole, Floral Silk Kurta">
          </div>

          <div class="form-group">
            <label>Price (₹)</label>
            <input type="number" name="price" class="form-control" required min="50" placeholder="e.g. 450">
          </div>

          <div class="form-group">
            <label>Description</label>
            <textarea name="desc" class="form-control" required placeholder="Materials, turnaround, technique..."></textarea>
          </div>

          <button type="submit" class="btn btn-gold" style="width:100%;">
            Publish to Storefront →
          </button>
        </form>
      `;
      document.getElementById('modal-container').classList.add('show');
    }

    function handleAddProductSubmit(e, makerId) {
      e.preventDefault();
      const form = e.target;
      const m = db.makers.find(x => x.id === makerId);
      if (m) {
        if (!m.products) m.products = [];
        m.products.push({
          id: 'p-' + Date.now().toString().slice(-4),
          title: form.title.value,
          price: Number(form.price.value),
          desc: form.desc.value,
          photo: m.coverPhoto || 'images/sneaker_footshop.jpg'
        });
        saveDatabase();
      }
      closeModal();
      showToast('Piece added to storefront catalog!');
      renderCurrentPage();
    }

    function openRejectOrderModal(orderId) {
      const modal = document.getElementById('modal-content');
      modal.innerHTML = `
        <div class="modal-head">
          <h2>Decline Order</h2>
          <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <p style="font-size:13px;color:var(--ink-muted);margin-bottom:14px;">Select decline reason:</p>
        <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px;">
          <label><input type="radio" name="rej_reason" value="Queue full" checked> Queue is currently full</label>
          <label><input type="radio" name="rej_reason" value="Out of materials"> Required materials not in stock</label>
          <label><input type="radio" name="rej_reason" value="Other"> Other</label>
        </div>
        <button class="btn btn-coral" style="width:100%;" onclick="confirmReject('${orderId}')">Confirm Decline</button>
      `;
      document.getElementById('modal-container').classList.add('show');
    }

    function confirmReject(orderId) {
      const reasonEl = document.querySelector('input[name="rej_reason"]:checked');
      const reason = reasonEl ? reasonEl.value : 'Queue is currently full';
      localLoop.orders.reject({ orderId, rejectReason: reason }).then(() => {
        closeModal();
        showToast('Order declined');
        renderCurrentPage();
      }).catch(err => {
        alert(err.message || 'Error declining order');
      });
    }

    function updateOrderStatus(orderId, newStatus) {
      let promise;
      if (newStatus === 'Accepted') promise = localLoop.orders.acceptFixedPrice(orderId);
      else if (newStatus === 'In progress') promise = localLoop.orders.start(orderId);
      else if (newStatus === 'Ready') promise = localLoop.orders.markReady(orderId);
      else if (newStatus === 'Collected') promise = localLoop.orders.markCollected(orderId);
      else {
        const o = db.orders.find(x => x.id === orderId);
        if (o) { o.status = newStatus; saveDatabase(); }
        promise = Promise.resolve();
      }

      promise.then(() => {
        showToast(`Status updated: ${newStatus}`);
        setTimeout(() => {
          renderCurrentPage();
        }, 550);
      }).catch(err => {
        alert(err.message || 'Status transition error');
      });
    }

    function markOrderCollected(orderId) {
      updateOrderStatus(orderId, 'Collected');
    }


    /* ==========================================================================
       VERIFIED PATRON REVIEWS (ZEPHYR Backend Integration)
       ========================================================================== */
    function openReviewModal(orderId) {
      const o = db.orders.find(x => x.id === orderId);
      if (!o) return;
      const m = db.makers.find(x => x.id === o.makerId);

      const modal = document.getElementById('modal-content');
      modal.innerHTML = `
        <div class="modal-head">
          <div>
            <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--royal-gold);">Verified Patron Review</div>
            <h2>Review Order #${o.id}</h2>
          </div>
          <button class="modal-close" onclick="closeModal()">×</button>
        </div>

        <form onsubmit="handleReviewSubmit(event, '${o.id}')">
          <div style="background:var(--bg);border-radius:12px;padding:14px;margin-bottom:16px;">
            <b style="font-family:var(--font-serif);">${escapeHtml(o.service)}</b>
            <small style="display:block;color:var(--ink-muted);margin-top:2px;">Atelier: ${escapeHtml(m?.name || 'Artisan')}</small>
          </div>

          <div class="form-group">
            <label>Artisan Rating</label>
            <select name="rating" class="form-control" style="font-size:15px;font-weight:700;color:var(--royal-gold);">
              <option value="5">★★★★★ 5 Stars · Masterpiece Craftsmanship</option>
              <option value="4">★★★★☆ 4 Stars · Very Good Finish & Precision</option>
              <option value="3">★★★☆☆ 3 Stars · Satisfactory Craft</option>
              <option value="2">★★☆☆☆ 2 Stars · Needs Improvement</option>
              <option value="1">★☆☆☆☆ 1 Star · Subpar</option>
            </select>
          </div>

          <div class="form-group">
            <label>Review & Feedback</label>
            <textarea name="text" class="form-control" rows="3" placeholder="Share your thoughts on the craftsmanship, fit, and artisan interaction..." required></textarea>
          </div>

          <button type="submit" class="btn btn-gold" style="width:100%;">
            Publish Review to Atelier Profile ★
          </button>
        </form>
      `;
      document.getElementById('modal-container').classList.add('show');
    }

    function handleReviewSubmit(e, orderId) {
      e.preventDefault();
      const form = e.target;
      const rating = Number(form.rating.value);
      const text = form.text.value;

      localLoop.reviews.create({ orderId, rating, text }).then(() => {
        closeModal();
        showToast('★ Review published to atelier profile!');
        renderCurrentPage();
      }).catch(err => {
        alert(err.message || 'Error submitting review');
      });
    }

    function closeModal() {
      document.getElementById('modal-container').classList.remove('show');
    }

    function setCategoryFilter(cat) {
      categoryFilter = cat;
      renderCurrentPage();
    }

    function setRateTierFilter(tier) {
      rateTierFilter = tier;
      renderCurrentPage();
    }

    function handleSearch(val) {
      searchQuery = val;
      renderCurrentPage();
    }

    function handlePriceSlider(val) {
      maxPriceSlider = Number(val);
      renderCurrentPage();
    }

    function handleSortChange(val) {
      sortMode = val;
      renderCurrentPage();
    }

    function toggleSaveMaker(id) {
      let updated = [...(db.savedMakers || [])];
      if (updated.includes(id)) {
        updated = updated.filter(x => x !== id);
        showToast('Removed from saved');
      } else {
        updated.push(id);
        showToast('Atelier saved to favourites ♥');
      }
      localLoop.users.updateSavedMakers(updated).then(() => {
        renderCurrentPage();
      });
    }

    function toggleShopPause(makerId) {
      const m = db.makers.find(x => x.id === makerId);
      if (m) {
        m.paused = !m.paused;
        saveDatabase();
        showToast(m.paused ? 'Orders paused' : 'Shop open for orders');
        renderCurrentPage();
      }
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      db.theme = next;
      saveDatabase();
      document.getElementById('theme-icon').textContent = next === 'dark' ? '☀' : '☾';
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      const text = document.getElementById('toast-text');
      if (t && text) {
        text.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2800);
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /* Initialize */
    if (db.theme) {
      document.documentElement.setAttribute('data-theme', db.theme);
      document.getElementById('theme-icon').textContent = db.theme === 'dark' ? '☀' : '☾';
    }
    renderCurrentPage();
  </script>
</body>
</html>
